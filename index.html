<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lords Mobile — Статистика Вбивств</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="border-b border-slate-700 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-red-500">⚔️ Lords Mobile — Статистика Вбивств</h1>
                <p class="text-slate-400 text-sm">Аналіз 1 файлу або порівняння динаміки 2 періодів</p>
            </div>
            <span id="modeBadge" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700">Очікування даних</span>
        </header>

        <!-- Upload Files Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- File 1 (Primary / Past) -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-semibold text-slate-200">📁 Звіт 1 (Основний / Минулий)</label>
                    <span id="statusFile1" class="text-xs text-rose-400">Не обрано</span>
                </div>
                <input type="file" id="fileInput1" accept=".xlsx, .xls" 
                    class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-500 cursor-pointer">
            </div>

            <!-- File 2 (Optional: Current) -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-semibold text-slate-200">📁 Звіт 2 (Поточний для порівняння — опціонально)</label>
                    <span id="statusFile2" class="text-xs text-slate-400">Не обрано</span>
                </div>
                <input type="file" id="fileInput2" accept=".xlsx, .xls" 
                    class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer">
            </div>
        </div>

        <!-- Search & Filter Controls -->
        <div id="controlsPanel" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label class="block text-sm font-medium text-slate-300 mb-1">Пошук за ніком</label>
                <input type="text" id="searchInput" placeholder="Введіть нік..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
            </div>

            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label class="block text-sm font-medium text-slate-300 mb-1">Фільтр активності</label>
                <select id="filterActivitySelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                    <option value="all">Усі гравці</option>
                    <option value="active">Мають приріст (> 0)</option>
                    <option value="zero">Без приросту (0 або менше)</option>
                </select>
            </div>

            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col justify-end">
                <button id="copyListBtn" onclick="copyTableData()" 
                    class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium text-sm py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                    📋 Скопіювати поточний список
                </button>
            </div>
        </div>

        <!-- Stats Overview Cards -->
        <div id="statsGrid" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                <p class="text-slate-400 text-xs">Всього гравців</p>
                <p id="statTotal" class="text-xl font-bold text-slate-100">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                <p class="text-slate-400 text-xs">Активні (> 0)</p>
                <p id="statActive" class="text-xl font-bold text-emerald-400">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                <p class="text-slate-400 text-xs">Без приросту (0)</p>
                <p id="statZero" class="text-xl font-bold text-rose-400">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                <p id="statTotalDiffLabel" class="text-slate-400 text-xs">Загальний приріст</p>
                <p id="statDiff" class="text-xl font-bold text-amber-400">0</p>
            </div>
        </div>

        <!-- Table View -->
        <div id="tableContainer" class="hidden bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead id="tableHead" class="bg-slate-900 text-slate-400 uppercase text-xs border-b border-slate-700 select-none">
                        <!-- Динамічні заголовки в залежності від режиму -->
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700/50"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let file1Map = new Map();
        let file2Map = new Map();
        let combinedData = [];

        let currentSortKey = 'diff';
        let currentSortOrder = 'desc';

        document.getElementById('fileInput1').addEventListener('change', (e) => parseFile(e, 1));
        document.getElementById('fileInput2').addEventListener('change', (e) => parseFile(e, 2));
        document.getElementById('searchInput').addEventListener('input', renderTable);
        document.getElementById('filterActivitySelect').addEventListener('change', renderTable);

        function parseFile(e, fileNumber) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                let nameIdx = 1;
                let killsIdx = 6;
                let prevIdx = 7;
                let diffIdx = 8;

                for (let r = 0; r < Math.min(rawRows.length, 5); r++) {
                    const row = rawRows[r];
                    for (let c = 0; c < row.length; c++) {
                        const val = String(row[c]).trim().toLowerCase();
                        if (val === 'user name' || val === 'name' || val === 'нікнейм') nameIdx = c;
                        if (val === 'вбивства' || val.includes('kills')) killsIdx = c;
                        if (val === 'попередні вбивства' || val.includes('previous')) prevIdx = c;
                        if (val === 'різниця вбивств' || val.includes('difference')) diffIdx = c;
                    }
                }

                const map = new Map();
                for (let i = 0; i < rawRows.length; i++) {
                    const row = rawRows[i];
                    if (!row || row.length <= nameIdx) continue;

                    const name = String(row[nameIdx] || "").trim();
                    if (!name || 
                        name.toLowerCase() === 'user name' || 
                        name.toLowerCase() === 'name' || 
                        name.toLowerCase() === 'нікнейм' || 
                        name.toLowerCase().includes('total') || 
                        name.toLowerCase().includes('user id')) continue;

                    const kills = parseFloat(row[killsIdx]) || 0;
                    const prevKills = parseFloat(row[prevIdx]) || 0;
                    let diff = parseFloat(row[diffIdx]);
                    if (isNaN(diff)) diff = kills - prevKills;

                    map.set(name.toLowerCase(), { name, kills, prevKills, diff });
                }

                if (fileNumber === 1) {
                    file1Map = map;
                    document.getElementById('statusFile1').innerText = `✅ Завантажено (${map.size})`;
                    document.getElementById('statusFile1').className = 'text-xs text-emerald-400 font-semibold';
                } else {
                    file2Map = map;
                    document.getElementById('statusFile2').innerText = `✅ Завантажено (${map.size})`;
                    document.getElementById('statusFile2').className = 'text-xs text-emerald-400 font-semibold';
                }

                processData();
            };
            reader.readAsArrayBuffer(file);
        }

        function processData() {
            if (file1Map.size === 0 && file2Map.size === 0) return;

            const isComparisonMode = file1Map.size > 0 && file2Map.size > 0;
            const badge = document.getElementById('modeBadge');

            if (isComparisonMode) {
                badge.innerText = 'Режим: Порівняння 2 періодів';
                badge.className = 'bg-amber-500/20 text-amber-400 text-xs px-3 py-1.5 rounded-full border border-amber-500/30 font-semibold';
                
                const allKeys = new Set([...file1Map.keys(), ...file2Map.keys()]);
                combinedData = [];

                allKeys.forEach(k => {
                    const f1 = file1Map.get(k);
                    const f2 = file2Map.get(k);

                    const name = f2 ? f2.name : f1.name;
                    const f1Diff = f1 ? f1.diff : 0;
                    const f2Diff = f2 ? f2.diff : 0;
                    const growth = f2Diff - f1Diff; // Динаміка приросту

                    combinedData.push({
                        name,
                        f1Diff,
                        f2Diff,
                        growth,
                        diff: f2Diff // Основний показник для сортування за замовчуванням
                    });
                });
            } else {
                badge.innerText = 'Режим: Перегляд 1 файлу';
                badge.className = 'bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1.5 rounded-full border border-emerald-500/30 font-semibold';

                const targetMap = file1Map.size > 0 ? file1Map : file2Map;
                combinedData = Array.from(targetMap.values());
            }

            document.getElementById('controlsPanel').classList.remove('hidden');
            document.getElementById('statsGrid').classList.remove('hidden');
            document.getElementById('tableContainer').classList.remove('hidden');

            renderTable();
        }

        function setSortKey(key) {
            if (currentSortKey === key) {
                currentSortOrder = currentSortOrder === 'desc' ? 'asc' : 'desc';
            } else {
                currentSortKey = key;
                currentSortOrder = 'desc';
            }
            renderTable();
        }

        function getFilteredData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterActivity = document.getElementById('filterActivitySelect').value;
            const isComparison = file1Map.size > 0 && file2Map.size > 0;

            return combinedData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm);
                if (!matchesSearch) return false;

                const primaryVal = isComparison ? item.f2Diff : item.diff;
                if (filterActivity === 'active') return primaryVal > 0;
                if (filterActivity === 'zero') return primaryVal <= 0;
                return true;
            });
        }

        function renderTable() {
            if (!combinedData.length) return;

            const isComparison = file1Map.size > 0 && file2Map.size > 0;
            let filtered = getFilteredData();

            // Сортування
            filtered.sort((a, b) => {
                let valA = a[currentSortKey] !== undefined ? a[currentSortKey] : 0;
                let valB = b[currentSortKey] !== undefined ? b[currentSortKey] : 0;

                if (typeof valA === 'string') {
                    return currentSortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return currentSortOrder === 'asc' ? valA - valB : valB - valA;
            });

            // Оновлення шапки таблиці
            const thead = document.getElementById('tableHead');
            const arrow = (key) => currentSortKey === key ? (currentSortOrder === 'desc' ? ' ▼' : ' ▲') : '';

            if (isComparison) {
                thead.innerHTML = `
                    <tr>
                        <th class="px-5 py-3 text-center w-12">#</th>
                        <th class="px-5 py-3 cursor-pointer hover:text-white" onclick="setSortKey('name')">Нікнейм${arrow('name')}</th>
                        <th class="px-5 py-3 text-right cursor-pointer hover:text-white" onclick="setSortKey('f1Diff')">Звіт 1 (+Кіли)${arrow('f1Diff')}</th>
                        <th class="px-5 py-3 text-right cursor-pointer hover:text-white" onclick="setSortKey('f2Diff')">Звіт 2 (+Кіли)${arrow('f2Diff')}</th>
                        <th class="px-5 py-3 text-right cursor-pointer hover:text-white" onclick="setSortKey('growth')">Динаміка${arrow('growth')}</th>
                    </tr>
                `;
            } else {
                thead.innerHTML = `
                    <tr>
                        <th class="px-5 py-3 text-center w-12">#</th>
                        <th class="px-5 py-3 cursor-pointer hover:text-white" onclick="setSortKey('name')">Нікнейм${arrow('name')}</th>
                        <th class="px-5 py-3 text-right cursor-pointer hover:text-white" onclick="setSortKey('kills')">Вбивства (G)${arrow('kills')}</th>
                        <th class="px-5 py-3 text-right cursor-pointer hover:text-white" onclick="setSortKey('prevKills')">Попередні (H)${arrow('prevKills')}</th>
                        <th class="px-5 py-3 text-right cursor-pointer hover:text-white" onclick="setSortKey('diff')">Різниця (I)${arrow('diff')}</th>
                    </tr>
                `;
            }

            // Статистика
            const primaryArray = isComparison ? combinedData.map(d => d.f2Diff) : combinedData.map(d => d.diff);
            const activeCount = primaryArray.filter(v => v > 0).length;
            const zeroCount = primaryArray.filter(v => v <= 0).length;
            const totalDiffSum = primaryArray.reduce((a, b) => a + b, 0);

            document.getElementById('statTotal').innerText = combinedData.length;
            document.getElementById('statActive').innerText = activeCount;
            document.getElementById('statZero').innerText = zeroCount;
            document.getElementById('statDiff').innerText = (totalDiffSum >= 0 ? '+' : '') + totalDiffSum.toLocaleString();

            // Тіло таблиці
            const tbody = document.getElementById('tableBody');
            if (isComparison) {
                tbody.innerHTML = filtered.map((p, idx) => `
                    <tr class="hover:bg-slate-700/30 transition-colors">
                        <td class="px-5 py-3 text-center text-slate-500 font-mono text-xs">${idx + 1}</td>
                        <td class="px-5 py-3 font-medium text-white">${escapeHtml(p.name)}</td>
                        <td class="px-5 py-3 text-right font-mono text-slate-300">${p.f1Diff > 0 ? '+' : ''}${p.f1Diff.toLocaleString()}</td>
                        <td class="px-5 py-3 text-right font-mono font-bold ${p.f2Diff > 0 ? 'text-emerald-400' : 'text-slate-400'}">${p.f2Diff > 0 ? '+' : ''}${p.f2Diff.toLocaleString()}</td>
                        <td class="px-5 py-3 text-right font-mono font-semibold ${p.growth > 0 ? 'text-emerald-400' : p.growth < 0 ? 'text-rose-400' : 'text-slate-400'}">
                            ${p.growth > 0 ? '+' : ''}${p.growth.toLocaleString()}
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = filtered.map((p, idx) => `
                    <tr class="hover:bg-slate-700/30 transition-colors">
                        <td class="px-5 py-3 text-center text-slate-500 font-mono text-xs">${idx + 1}</td>
                        <td class="px-5 py-3 font-medium text-white">${escapeHtml(p.name)}</td>
                        <td class="px-5 py-3 text-right font-mono text-slate-300">${p.kills.toLocaleString()}</td>
                        <td class="px-5 py-3 text-right font-mono text-slate-400">${p.prevKills.toLocaleString()}</td>
                        <td class="px-5 py-3 text-right font-mono font-bold ${p.diff > 0 ? 'text-emerald-400' : p.diff < 0 ? 'text-rose-400' : 'text-slate-400'}">
                            ${p.diff > 0 ? '+' : ''}${p.diff.toLocaleString()}
                        </td>
                    </tr>
                `).join('');
            }
        }

        function copyTableData() {
            const filtered = getFilteredData();
            if (!filtered.length) return alert('Список порожній!');

            const isComparison = file1Map.size > 0 && file2Map.size > 0;
            let text = isComparison 
                ? `⚔️ *ПОРІВНЯННЯ РІЗНИЦІ ВБИВСТВ (2 ПЕРІОДИ)*\n----------------------------------\n`
                : `⚔️ *СТАТИСТИКА ВБИВСТВ*\n----------------------------------\n`;

            filtered.forEach((p, i) => {
                if (isComparison) {
                    text += `${i + 1}. ${p.name} — Звіт 1: +${p.f1Diff.toLocaleString()} | Звіт 2: +${p.f2Diff.toLocaleString()} (${p.growth >= 0 ? '+' : ''}${p.growth.toLocaleString()})\n`;
                } else {
                    text += `${i + 1}. ${p.name} – ${p.diff > 0 ? '+' : ''}${p.diff.toLocaleString()}\n`;
                }
            });

            text += `----------------------------------\nВсього: ${filtered.length} осіб.`;

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyListBtn');
                const orig = btn.innerHTML;
                btn.innerHTML = '✅ Скопійовано!';
                setTimeout(() => { btn.innerHTML = orig; }, 2000);
            });
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
